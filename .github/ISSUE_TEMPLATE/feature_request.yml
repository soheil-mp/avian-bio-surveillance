name: "Feature Request"
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for suggesting an improvement! Please search
        [existing issues](https://github.com/soheil-mp/avian-biosurveillance/issues)
        before filing a new one.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: >
        What problem does this feature solve? A clear description of the pain point.
        Example: "I'm frustrated when..."
    validations:
      required: false

  - type: textarea
    id: proposed-solution
    attributes:
      label: Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project does this relate to?
      multiple: true
      options:
        - Ingestion
        - Processing
        - Feature Engineering
        - Modeling
        - Database
        - Orchestration
        - Infrastructure (e.g., Docker, CI/CD)
        - Frontend / Dashboard
        - Documentation
        - Other
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      description: How important is this to your workflow?
      options:
        - "P0 — Critical to have"
        - "P1 — Important but not urgent"
        - "P2 — Nice to have"
        - "P3 — Low priority"
      default: 0
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: >
        Add mockups, diagrams, references to papers, or any other context.
        Tip: you can attach images by dragging them into this area.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Branch naming convention:** When working on this issue, create a branch using:
        ```
        feat/<issue-number>-<short-description>
        ```
        Example: `feat/15-ml-pipeline-phase1`
