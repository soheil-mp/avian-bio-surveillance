# =============================================================================
# Docker Hub Publish Workflow
# =============================================================================
# Builds and pushes the Avian Biosurveillance Docker image to Docker Hub when
# changes are pushed to the master branch.
#
# Required Secrets:
#   - DOCKERHUB_USERNAME: Your Docker Hub username
#   - DOCKERHUB_TOKEN: Docker Hub access token (NOT your password)
#
# To create a Docker Hub access token:
#   1. Go to https://hub.docker.com/settings/security
#   2. Click "New Access Token"
#   3. Give it a name (e.g., "github-actions")
#   4. Copy the token and add it as a GitHub secret
# =============================================================================

name: Docker Hub Publish

on:
#   push:
#     branches:
#       - master
  workflow_dispatch: # Allow manual trigger

env:
  DOCKERHUB_USERNAME: soheilmp
  IMAGE_NAME: avian-biosurveillance

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Set up Docker Buildx for advanced build features
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Authenticate with Docker Hub
      # -----------------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Extract metadata for Docker image tags and labels
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag as 'latest' for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with short commit SHA for traceability
            type=sha,prefix=sha-,format=short

      # -----------------------------------------------------------------------
      # Build and push Docker image
      # -----------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.orchestration
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
